# Names for dead if (false) blocks, by the signature of their dead code (docs/research/dead-code.md,
# "Names"; `atel dead` lists every block with its signature). A named block is written
# `if (Cut.Name)`, a constant false of Ffx.Cut (src/Ffx.Atel.Game/Cut.cs, where each name's doc
# comment says what the code does), so the source still compiles to the shipped bytes. Several
# signatures may share a name: the copies of one feature in several workers are one switch. Only
# blocks whose code is understood get a name. Our own names: no game code or text.
#
# The comment after each line: where the blocks are (script, worker, entry, offset of the jmp).

