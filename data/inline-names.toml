# Names for the inline methods the decompiler writes for code a worker repeats (docs/language.md,
# "Repeated code"), by the signature of the method's body: a hash of its statements as lifted from the
# bytecode (natives and opcodes by number, constants by value, variables by location word and length,
# parameters by index), not of the C# the decompiler writes for them, so a name stays when that C#
# changes. A method not named here is RepeatedNN.
#
#   "signature" = "Name"                     the method's name
#   "signature" = "Name(a, b)"               and its parameters' names, in order
#   "signature" = { name = "Name(a, b)", summary = "What it does." }
#                                            and its <summary> (no double quotes; `x` is code)
#
# Each name says what the code does, read off the natives and members it calls and, for the
# blitzball HUD, the texts it shows: not a guessed role. The same code in several workers or scripts
# has one name (a signature per copy where the variables lie elsewhere). The blitzball words: a panel
# is a player's HUD box (message window 4 or 5 and its sprite column), the shown value and colour
# code are the variables the stat and digit sprites read, a tech is an entry of BlitzballPlayerTechs
# (its cost, power and rate are the script's tech tables), the list is the ten-entry log of message
# window 6. Our own names: no game code or text. The corpus test fails when a signature here names
# no helper the decompiler writes.
#
# To list the signatures: ATEL_DUMP_REPEATS=<file> atel decompile all -o <dir> appends a line per
# method (signature, script.worker, places, lines, body as C#) to <file>, which holds game code:
# keep it local.
#
# The comment after each line: the workers that have the method in the decompiled corpus, their
# calls, and the scripts.

