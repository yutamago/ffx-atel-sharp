[summaries]
ApplyChosenTech = "Without a chosen tech, takes the player's cost and sets the value from the stat; with one, takes the tech's cost and adds its power to the stat."
ApplyPassTech = "The pass (Action: Pass, shown for players 8 and up): without a chosen tech the player's cost is taken and the value is the pass stat; with one, the tech's cost is taken and its power added (at most 99)."
ApplyShotTech = "The shot (Action: Shoot, shown for players 8 and up): without a chosen tech the player's cost is taken and the value is the shot stat; with one, the tech's cost is taken and its power added (at most 99)."
AskChoice = "Opens the question, shows the choice (MsgShowWaitResult) and closes it, then a switch on the answer."
AverageTeamLevels = "The average of BlitzballPlayerLevels over the Aurochs (team 5) and over the team picked from the table, then a switch on the latter."
CheckMonsterCaptures = "When the captures of a monster (CheckCaptMonster) reach the number needed, counts it and sets the bit in the flag array."
CheckTechCosts = "Sets the flag when any of techs 50, 52, 53, 54, 56 and 57 (each where its argument is set) costs more than the budget."
Clamp = "Clamps the computed value to 1-max."
ClearList = "The ten list entries set to 92 and written into message window 6."
ClearUncoveredTechs = "Clears both pages of BlitzballPlayerUncoveredTechs for six players."
ColourAndPlace = "Scales and colours a sprite by the colour code (0-5), then places it at the panel's position plus dx."
ComputePlayerStats = "For the sixteen players: each stat from BlitzballPlayerLevels by its curve (linear, square or fourth root, or a power), clamped to 1-9999."
CountAurochsWin = "BlitzballAurochsWins raised by one after a won match (not in mode 2, below 65000), the wins written into message window 0, and a switch on every fifth win."
CountDownContract = "When the player has a contract (not 255), notes the player and lowers BlitzballPlayerContracts by one; at 0 the contract ends."
CountWorkersWithin = "Counts how many of three workers are within their radius (DistanceXZ) of this worker."
DrawPanel0 = "Panel 0: the four-digit value and the stat icons with their values."
DrawPlayerPanel = "The player panel: the four-digit value, then three stat icons with their two-digit values (each stat picked by a selector, 1-8), coloured by the buff and debuff arrays."
DrawPlayerPanelOf = "The player panel for one player: the four-digit value and the stat icons, values and markers."
FaceAndPlayShotMotion = "Stops, faces a worker, then plays the motion for the model kind and the chosen shot tech (or none), with the request after 34 frames."
FillTechSlots = "Per player kind: for each tech the player has learned and has not yet, with a 1-in-chance roll and a free slot, writes it into BlitzballPlayerTechs and takes its cost from the budget."
FindTechAndListLearners = "Which of two techs the player has in a slot, then the players of the team who may learn it, a request to W24 and the state set to 2 and 3."
FocusCameraOnPlayer = "The camera cut to the player's worker, then the player panels' message windows and sprites closed."
GiveReward = "Sets bit flag 1 or 2, says the line, gives the event reward, sets the bit in a save array and the state."
GiveTechIfLearned = "With a free slot, writes the tech into the player's BlitzballPlayerTechs when its bit is learned (page 2; page 1 is a dead block) and not given yet, and takes its cost from the budget."
HidePlayerPanel = "Closes message window 5 and hides a column of panel sprites."
ListPlayersForTech = "Lists the players of the current team for whom the current tech is uncovered but not yet learned (by the bit arrays per page)."
ListPlayersForTechAndSignal = "Lists the players that may learn the current tech (by the learned and uncovered bits), requests W24 entry 7, waits, sets the state to 2, waits, to 3, and requests W24 entry 9."
ListTechIfAffordable = "Adds a tech to the list when the player has it in a slot and can pay its cost."
ListTechsIfAffordable = "Adds each of two techs to the list when the player has it in a slot and can pay its cost."
LoadAliasAutoMotions = "Stores the model kind, ChrLoadAlias, then the automatic motions 16, 18 and 19 (a folded team branch: a dead second motion 16)."
MoveBesideTidus = "Picks a random distance (0-18) on a random side of Tidus along x, turns towards that point and starts moving there (without waiting)."
MoveToWithPitch = "Stops, faces the point (yaw and pitch), then turns and moves to it and waits."
MoveViaPoint = "Turns and moves to the first point and waits, then to the second."
OpenAndPlayVoice = "Opens a window, then prepares and plays a voice, stopping it on button 32, and waits for the sound."
OpenNameWindow = "The player's name (MacroDicText 26) in message window 4 (window 5 is dead), opened at the panel."
PlayChosenTechByModel = "The motion for the model kind, with no chosen tech or by the chosen tech, with the learners of the tech listed."
PlayMotionAndWaitW18 = "The motion (unblended), W32 entry 8 requested, W18's entry 9 awaited, then the motion's end."
PlayMotionSet = "Stops all movement, then plays the motion of the selected set (switch on a constant) unless it is already playing."
PlayShotTechMotion = "Per chosen shot tech: its motion and effect, the state set to 2 and 3 and sprite 127 hidden."
PlayStreamWithSubtitle = "A voice stream started; while the battle's subtitle switch is on, its subtitle drawn and the window closed when the stream ends; then waits for the stream."
PlayStreamWithSubtitleAndTalk = "A voice stream started with the speaker's mouth moving; while the battle's subtitle switch is on, its subtitle drawn and the window closed when the stream ends; then waits for the stream."
PlayTechWithEffect = "The tech: its rank and motion, the effect bound to the attach bone, the state set to 2 and 3 and sprite 127 hidden, then W18's entry awaited and the motion and effect ended."
PlayVoiceSkippable = "Prepares and starts a voice, stops it when button 32 is pressed, then waits for the sound."
RandomOffsets = "Random signed offsets (up to 80, 40, 80) and a random value above 25 into the worker's variables."
RandomizeLevelAndStats = "A player's BlitzballPlayerLevels set to the average level - 5 plus a random 0-9 (at most 99), then the stats from the level by their curves."
RequestAndRollReactionTech = "Requests a worker's entry, then with the action's chance the player's matching tech is rolled (rate and cost); on success its effect, the learners listed and the state set to 2 and 3."
ResetPlayerTechStats = "Clears a player's per-match tech values, then takes the highest rate and cost of the techs in the player's slots per tech kind."
RollBreakOrRequest = "With the player's chance and cost (and allowed set), a player near the goal worker (21 or 22, distance under 400) breaks off; otherwise the action is requested from W01 and W18, the log updated and every panel closed."
RollReactionTech = "By the action's rank (1, 3 or 4): with the action's chance, the other player rolls the matching tech of theirs (rate and cost); on success its sound and effect, the players who may learn techs 46 or 47 listed, the cost taken and the list updated; else a request to W32."
RollTechs55And58 = "Tries the player's techs 55 and 58 in turn: when the player has the tech in a slot and the random roll is under its rate and the cost is affordable, the stat arrays are cleared, the cost taken and the player panel redrawn with the effect; then the players are sorted by distance (SortPlayersByDistance)."
SayForFrames = "Opens the window, waits until it is open and for the frame count, then closes it."
SayVoicedWithAutoTalk = "A voiced line: the voice prepared, the window opened, the speaker's mouth moving while the voice plays (stopped on button 32 once the window is ready), then the window closed."
SayWithVoiceSkippable = "A voiced line: the voice prepared, the window opened, the voice stopped on buttons 160 once the window is ready, then the window closed."
ScoreGoal = "A goal: the sound, the goal log entry, the scorer's team's score (BlitzballAurochsScore or BlitzballOpponentScore) raised by one, the effects and the scoreboard digits (TexSwapSetFrame), then every message window and panel sprite closed."
ScrollList = "The ten-entry list scrolled up by two, with a request to W19."
ScrollListAndAdd = "The ten-entry list scrolled up by two, the player and the entry added, written into message window 6 and the window opened."
SetByVoiceEvent = "Two variables set by whether the battle's voice event is 2."
SetCameraPolarBySide = "The camera's polar position, its first value by whether the current player is on the first side (under 8)."
SetMapParts = "Hides and shows a fixed set of map parts, and parts 7 and up by bit 0 of each entry of a save array."
SetMinimapMarkers = "The minimap marker of players first-last: 512 while flagged, the own marker for the current player, else the other marker."
SetMotionByModel = "The motion for the model kind (0-2), blending off."
SetParty = "Adds six party members, then swaps members into the first slots."
SetPassTechMotion = "Per chosen pass tech (14-22): its rank (1-3) and the motion, unblended."
SetTechMotion = "Per chosen tech (26-37): its rank (1-4), its sound and the motion, unblended."
SetTechMotionByModel = "The motion (unblended) and rank for the model kind and the chosen tech (26-34), or none."
ShootWithTech = "The shot by the chosen shot tech: its motion, sound and effects per tech, then the panel and markers."
ShowFourDigits = "A player's four-digit value as digit sprites at a panel (leading zeros hidden), violet while its flag array is set."
ShowFourDigitsAtPanel0 = "The current player's four-digit value as digit sprites at panel 0 (leading zeros hidden), violet while its flag array is set."
ShowFourDigitsOfListed = "The four-digit value of the listed player in the loop as digit sprites at its panel (leading zeros hidden), violet while its flag array is set."
ShowFourDigitsOfPlayer = "The player's four-digit value as digit sprites at the panel (leading zeros hidden), violet while its flag array is set."
ShowMapPartsByFlags = "Hides or shows map parts 7 and up by bit 0 of each entry of a save array."
ShowPlayerMarker = "The marker sprites of panel 0 (cyan for players 8 and up), after a dead block of the stat display."
ShowPlayerRow = "A player's row in message window 0: the name (MacroDicText 26) and a value as digit sprites."
ShowScoreboard = "Slides the scoreboard in: the team icon, both teams' scores and the match clock as digit sprites, then waits for W01's entry 50 and stops the effects."
ShowStatDigits = "The two-digit value of the selected stat (switch on a constant) as digit sprites at panel 0."
ShowStatIcon = "A stat's icon sprite (by the stat selector, 1-8), its value into the shown value and its colour code: 1 or 2 by the buff and debuff arrays, 3 when the highlight matches."
ShowStatIconOfListed = "A stat's icon sprite (by the stat selector, 1-8) for the listed player in the loop, its value into the shown value and its colour code: 1 or 2 by the buff and debuff arrays, 3 when the highlight matches."
ShowTensDigit = "The digit sprite of the shown value / 10, scaled, coloured and placed at the panel."
ShowTwoDigits = "Scales and places a stat's sprite, then the digit sprites of the shown value / 10 and % 10 (the tens hidden below 10)."
SlideInPanel0 = "Hides panel 0's sprites, then slides panel 0 in from the right (x from 670 to 370, 50 a frame), drawing it each frame."
SlideInPlayerPanel = "Hides the panel's sprites, then slides the panel in from the right (x from 640 to 340, 50 a frame), drawing it each frame."
SlideMarkerTo = "Moves sprites 127 and 126 to (x, y) in equal steps over the frames, shown and coloured each frame."
SortPlayersByDistance = "The sixteen players sorted by their distance (WorkerDistance) to the current player."
ToggleListWindow = "Message window 6 opened with the list text, or closed, by the window switch."
WaitAndEndPassTech = "Per chosen pass tech (14-22): waits, sets the state to 2, waits, to 3, requests W24's entry 9 and hides sprite 127."
WaitAndEndTech = "Per chosen tech (26-34): waits, sets the state to 2, waits, to 3 and hides sprite 127."
WaitForMotionFrame = "Waits a frame at a time until the motion reaches the frame (or starts over)."
WinPoseCamera = "Sets the actor's win sound, then orbits the camera by its win pose (another pose underwater, a random one of three otherwise)."
WinPoseCameraByActor = "The win camera of whichever party member V1 is (switch on the actor): its win sound, then the camera orbits by its win pose."
WriteList = "The ten-entry list written into message window 6: the new entry last, the names (MacroDicText 26) and values set with MsgSetValue."
