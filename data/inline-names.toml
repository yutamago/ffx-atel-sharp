# Names for the inline methods the decompiler writes for code a worker repeats (docs/language.md,
# "Repeated code"), by the signature of the method's body: its code as C#, with the script's
# variables and the parameters' names left out. A method not named here is RepeatedNN. Each name
# says what the code does, read off the natives it calls, not a guessed role; a parameter list
# after the name renames the parameters in order. Our own names: no game code or text.
#
# To list the signatures: ATEL_DUMP_REPEATS=<file> atel decompile all -o <dir> appends a line per
# method (signature, worker, places, lines, body as C#) to <file>, which holds game code: keep it local.
#
# The comment after each line: how many workers have the method in the decompiled corpus.

