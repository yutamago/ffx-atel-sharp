# Names for library classes (Library/ of the decompiled source), by the signature of the code
# their workers share (docs/source-repo.md, "Library names"). A class not named here keeps its
# number, SharedNNNN. Each name says what the code does, read off the natives it calls (their
# names are FFX.exe's), not a guessed role. Our own names: no game code or text.
#
# The comment after each line: the class's number and users at ffx-atel-sharp 5bf314c.

