[summaries]
"a0906c7d2afee71b" = "A function worker others call with Run(): on a worker of type 1 it sets the move speed, arrive radius, talk and touch ranges, talk angle and turn speeds to the same values everywhere."
"89d61db79ca75823" = "Attaches to camera 2 (AttachCamera(2, 0, 0)); entries 2 to 4 set one fixed view (RefSetPos, SetPolar, SetRoll, SetScreenDepth)."
"1e5a106de11263ab" = "Attaches to camera 1 (AttachCamera(1, 0, 0)); entries 2 to 5 do nothing, entry 6 clears the camera's reference areas (Cam.RefClearAreas)."
"ebd51a9ab11b1722" = "A worker of type 2 that does nothing: an empty Init, and Main waits forever."
"6d9123456f502e78" = "A worker of type 2 that does nothing: an empty Init, Main waits forever, and an empty entry 2."
"683add9233632c02" = "A worker of type 4 that does nothing: an empty Init, and Main waits forever."
