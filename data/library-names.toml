"882be3c016c4e9c3" = "A worker of type 1 that does nothing: an empty Init, Main waits forever, and entries 2 to 5 are empty."
"df87bf23dd14da1b" = "A worker of type 1 that does nothing: an empty Init, Main waits forever, and entries 2 to 6 are empty."
