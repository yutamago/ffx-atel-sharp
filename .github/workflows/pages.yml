# SPDX-License-Identifier: MIT
# The website in site/ (docs/website.md): built on every PR that touches it, deployed to GitHub Pages
# from main. The reference pages are generated first, from the code: the game library API from
# Ffx.Atel.Game's XML docs (tools/gen-api-pages.cs), the CLI usage from `atel --help` (tools/gen-cli-usage.cs).
name: Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "site/**"
      - "src/Ffx.Atel.Game/**"
      - "src/Ffx.Atel.Cli/**"
      - "tools/**"
      - "data/**"
      - "examples/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "src/Ffx.Atel.Game/**"
      - "src/Ffx.Atel.Cli/**"
      - "tools/**"
      - "data/**"
      - "examples/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push to main replaces a queued one, a running one finishes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # The version the tools build with counts the commits in HEAD's history (Directory.Build.targets).
        fetch-depth: 0

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: site/.nvmrc
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Build output, not in git: site/src/content/docs/reference/api/ and site/src/generated/.
    - name: Generate the API pages
      working-directory: .
      run: dotnet run tools/gen-api-pages.cs

    - name: Generate the CLI usage
      working-directory: .
      run: dotnet run tools/gen-cli-usage.cs

    - name: Install
      run: npm ci

    # starlight-links-validator fails the build on a broken internal link.
    - name: Build
      run: npx astro build

    - name: Upload the site
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v5
      with:
        path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v5
