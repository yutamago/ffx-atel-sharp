# SPDX-License-Identifier: MIT
# The release (docs/release.md). Runs only when the user pushes a tag v<version>
# (git tag v0.1.0-alpha.1 && git push origin v0.1.0-alpha.1); nothing else starts it, and no other workflow publishes.
#
# packages  packs AtelSharp.Sdk and AtelSharp.Templates with the tag's version (-p:Version, instead of the per-commit
#           version of every other build), checks them and keeps them as an artifact;
# editors   builds the VS Code extension (.vsix) and the Rider plugin (.zip) (editors.yml, as build.yml does);
# publish   pushes both packages to where the repository variable ATEL_NUGET_TARGET names:
#             nuget.org   through Trusted Publishing: a short-lived key for the account in the variable NUGET_USER;
#             github      GitHub Packages of this repository's owner, with the job's GITHUB_TOKEN;
#           unset, it stops before pushing anything. The templates go along unless ATEL_PUBLISH_TEMPLATES=false;
# release   creates the GitHub release of the tag, once the packages are pushed: both .nupkg, the .vsix and the
#           Rider zip, the version's CHANGELOG.md section as notes; a version with a suffix (-alpha.1) is a pre-release.
name: Release SDK

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    # The whole history: the release must be on main, and the build reads git (Directory.Build.targets).
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # v0.1.0-alpha.1 -> 0.1.0-alpha.1: a SemVer 2 version, which must sort above every per-commit build before it
    # (0.1.0-alpha.0.<commits>.g<commit>; docs/release.md, "Versions").
    - name: Version from the tag
      id: version
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
          echo "the tag $GITHUB_REF_NAME is not v<SemVer version>"; exit 1
        fi
        echo "VERSION=$version" >> "$GITHUB_ENV"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: The tag is on main
      shell: bash
      run: |
        git fetch origin main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "$GITHUB_REF_NAME is not a commit of main"; exit 1
        fi

    - name: The changelog has the version
      shell: bash
      run: |
        if ! grep -qE "^## \[$(printf '%s' "$VERSION" | sed 's/[.]/\\./g')\]" CHANGELOG.md; then
          echo "CHANGELOG.md has no section ## [$VERSION]"; exit 1
        fi

    - name: Build
      run: dotnet build -c Release ffx-atel-sharp.slnx -p:Version=${{ env.VERSION }}

    - name: Test
      run: dotnet test -c Release --no-build ffx-atel-sharp.slnx

    - name: Pack
      run: |
        dotnet pack -c Release src/Ffx.Atel.Sdk -p:Version=${{ env.VERSION }} -o artifacts/release
        dotnet pack -c Release src/Ffx.Atel.Templates -p:Version=${{ env.VERSION }} -o artifacts/release

    - name: Check the packages
      shell: bash
      run: |
        for id in AtelSharp.Sdk AtelSharp.Templates; do
          test -f "artifacts/release/$id.$VERSION.nupkg" || { echo "no $id.$VERSION.nupkg"; exit 1; }
        done
        for pkg in artifacts/release/*.nupkg; do
          if unzip -p "$pkg" | grep -aqF "$GITHUB_WORKSPACE"; then echo "$pkg names the checkout's path"; exit 1; fi
        done
        # The template pins the SDK of the release's version.
        unzip -p "artifacts/release/AtelSharp.Templates.$VERSION.nupkg" content/atel-mod/.template.config/template.json \
          | grep -qF "\"defaultValue\": \"$VERSION\"" || { echo "the template does not pin $VERSION"; exit 1; }

    - name: Keep the packages
      uses: actions/upload-artifact@v6
      with:
        name: packages-${{ env.VERSION }}
        path: artifacts/release/*.nupkg
        if-no-files-found: error

  editors:
    uses: ./.github/workflows/editors.yml

  publish:
    needs: [ packages, editors ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # nuget.org Trusted Publishing: GitHub's OIDC token is exchanged for a short-lived API key

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Get the packages
      uses: actions/download-artifact@v7
      with:
        name: packages-${{ needs.packages.outputs.version }}
        path: artifacts/release

    # nuget.org Trusted Publishing (policy: repository yutamago/ffx-atel-sharp, workflow release-sdk.yml, no
    # environment): a short-lived API key for this run, for the account in the repository variable NUGET_USER.
    - name: NuGet login (Trusted Publishing)
      id: nuget-login
      if: vars.ATEL_NUGET_TARGET == 'nuget.org'
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER }}

    # --skip-duplicate: a re-run (after a failed GitHub release, say) pushes nothing twice.
    - name: Push
      shell: bash
      env:
        VERSION: ${{ needs.packages.outputs.version }}
        TARGET: ${{ vars.ATEL_NUGET_TARGET }}
        TEMPLATES: ${{ vars.ATEL_PUBLISH_TEMPLATES }}
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        packages=("artifacts/release/AtelSharp.Sdk.$VERSION.nupkg")
        if [ "$TEMPLATES" != "false" ]; then packages+=("artifacts/release/AtelSharp.Templates.$VERSION.nupkg"); fi
        case "$TARGET" in
          nuget.org)
            if [ -z "$NUGET_API_KEY" ]; then echo "no nuget.org key: is NUGET_USER set and the Trusted Publishing policy in place? (docs/release.md)"; exit 1; fi
            for p in "${packages[@]}"; do
              dotnet nuget push "$p" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            done ;;
          github)
            for p in "${packages[@]}"; do
              dotnet nuget push "$p" --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" --skip-duplicate
            done ;;
          *)
            echo "the repository variable ATEL_NUGET_TARGET is not set (nuget.org or github): nothing pushed (docs/release.md)"
            exit 1 ;;
        esac

  release:
    needs: [ packages, editors, publish ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Get the packages and the editors
      uses: actions/download-artifact@v7
      with:
        path: downloads

    # The assets' names say which editor and which version: the .vsix is atel-text.vsix whatever its version.
    - name: Assets
      shell: bash
      env:
        VERSION: ${{ needs.packages.outputs.version }}
      run: |
        mkdir assets
        cp "downloads/packages-$VERSION/"*.nupkg assets/
        vsix=downloads/vscode-extension/atel-text.vsix
        vscode_version=$(unzip -p "$vsix" extension/package.json | jq -r .version)
        cp "$vsix" "assets/atel-text-vscode-$vscode_version.vsix"
        zip=$(ls downloads/rider-plugin/atel-text-*.zip)
        cp "$zip" "assets/atel-text-rider-$(basename "$zip" | sed 's/^atel-text-//')"
        ls -l assets

    # The version's section of CHANGELOG.md, without its heading: from "## [<version>]" to the next "## [".
    - name: Notes
      shell: bash
      env:
        VERSION: ${{ needs.packages.outputs.version }}
      run: |
        awk -v head="## [$VERSION]" '
          index($0, head) == 1 { on = 1; next }
          on && /^## \[/ { exit }
          on { print }
        ' CHANGELOG.md > notes.md
        test -s notes.md || { echo "CHANGELOG.md's section of $VERSION is empty"; exit 1; }

    - name: GitHub release
      shell: bash
      env:
        VERSION: ${{ needs.packages.outputs.version }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        prerelease=()
        if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
        gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag \
          --title "Atel# $VERSION" --notes-file notes.md "${prerelease[@]}"
