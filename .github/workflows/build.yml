# SPDX-License-Identifier: MIT
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    # The tools must run on every OS a modder may use. The corpus tests need
    # the game (FFX_GAME_DIR), which CI doesn't have, so they skip here.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build -c Release ffx-atel-sharp.slnx

    - name: Test
      run: dotnet test -c Release --no-build ffx-atel-sharp.slnx

    # The SDK package (docs/sdk.md), packed on every OS a modder may build on. It is not published
    # anywhere: the repo is private, and where it goes is still to be decided.
    - name: Pack the SDK
      run: dotnet pack -c Release src/Ffx.Atel.Sdk -o artifacts/sdk-feed

    - name: No checkout path in the SDK package
      shell: bash
      run: |
        pkg=$(ls artifacts/sdk-feed/Ffx.Atel.Sdk.*.nupkg)
        if unzip -p "$pkg" | grep -aqF "$GITHUB_WORKSPACE"; then
          echo "the SDK package names the checkout's path"; exit 1
        fi

  vscode:
    # The editor extension for message text (editors/vscode, docs/editor.md): built, unit-tested, checked in a
    # real VS Code (made-up text) and packaged; never published.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: editors/vscode/package-lock.json

    - name: Install
      run: npm ci

    - name: Test
      run: npm test

    - name: Test in VS Code
      run: xvfb-run -a npm run test:integration

    - name: Package
      run: npm run package

  rider:
    # The Rider plugin for message text (editors/rider, docs/editor.md): the backend's tests (the ReSharper test
    # framework, headless, on made-up text) and the plugin zip; never published.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/rider

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    # The Rider SDK's NuGet packages (about 3 GB) and the reference assemblies the test framework downloads.
    - name: Cache NuGet
      uses: actions/cache@v5
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/JetBrains
        key: rider-nuget-${{ runner.os }}-${{ hashFiles('editors/rider/src/dotnet/**/*.csproj', 'editors/rider/src/dotnet/*.props') }}

    - name: Test
      run: ./gradlew check --no-daemon

    - name: Build the plugin
      run: ./gradlew buildPlugin --no-daemon

    - name: Upload the plugin
      uses: actions/upload-artifact@v6
      with:
        name: rider-plugin
        path: editors/rider/build/distributions/*.zip
