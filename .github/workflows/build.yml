# SPDX-License-Identifier: MIT
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    # The tools must run on every OS a modder may use. The corpus tests need
    # the game (FFX_GAME_DIR), which CI doesn't have, so they skip here.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    # The whole history: the version counts HEAD's commits (Directory.Build.targets), and a shallow
    # clone stops the build.
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build -c Release ffx-atel-sharp.slnx

    - name: Test
      run: dotnet test -c Release --no-build ffx-atel-sharp.slnx

    # The SDK package and the dotnet new templates (docs/sdk.md), packed on every OS a modder may build on.
    # Not published: only the release workflow publishes, on a tag the user pushes (docs/release.md).
    - name: Pack the SDK
      run: dotnet pack -c Release src/Ffx.Atel.Sdk -o artifacts/sdk-feed

    - name: Pack the templates
      run: dotnet pack -c Release src/Ffx.Atel.Templates -o artifacts/sdk-feed

    - name: No checkout path in the packages
      shell: bash
      run: |
        for pkg in artifacts/sdk-feed/*.nupkg; do
          if unzip -p "$pkg" | grep -aqF "$GITHUB_WORKSPACE"; then
            echo "$pkg names the checkout's path"; exit 1
          fi
        done

  vscode:
    # The editor extension for message text (editors/vscode, docs/editor.md): built, unit-tested, checked in a
    # real VS Code (made-up text) and packaged; never published.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: editors/vscode/package-lock.json

    - name: Install
      run: npm ci

    - name: Test
      run: npm test

    - name: Test in VS Code
      run: xvfb-run -a npm run test:integration

    - name: Package
      run: npm run package

  rider:
    # The Rider plugin for message text (editors/rider, docs/editor.md): the backend's tests (the ReSharper test
    # framework, headless, on made-up text) and the plugin zip; never published.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/rider

    steps:
    # The Rider SDK (several GB unpacked) and Gradle's caches don't fit next to the runner image's
    # preinstalled toolchains; drop the ones this job doesn't use.
    - name: Free disk space
      working-directory: /
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
          /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft/msedge
        sudo docker image prune --all --force > /dev/null || true
        df -h /

    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    # The Rider SDK's NuGet packages (about 3 GB) and the reference assemblies the test framework downloads.
    - name: Cache NuGet
      uses: actions/cache@v5
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/JetBrains
        key: rider-nuget-${{ runner.os }}-${{ hashFiles('editors/rider/src/dotnet/**/*.csproj', 'editors/rider/src/dotnet/*.props') }}

    - name: Test
      run: ./gradlew check --no-daemon

    - name: Build the plugin
      run: ./gradlew buildPlugin --no-daemon

    - name: Upload the plugin
      uses: actions/upload-artifact@v6
      with:
        name: rider-plugin
        path: editors/rider/build/distributions/*.zip
