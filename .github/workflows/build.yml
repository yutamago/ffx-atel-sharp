# SPDX-License-Identifier: MIT
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    # The tools must run on every OS a modder may use. The corpus tests need
    # the game (FFX_GAME_DIR), which CI doesn't have, so they skip here.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    # The whole history: the version counts HEAD's commits (Directory.Build.targets), and a shallow
    # clone stops the build.
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build -c Release ffx-atel-sharp.slnx

    - name: Test
      run: dotnet test -c Release --no-build ffx-atel-sharp.slnx

    # The SDK package, the dotnet new templates and the atel tool (docs/sdk.md), packed on every OS a modder may build on.
    # Not published: only the release workflow publishes, on a tag the user pushes (docs/release.md).
    - name: Pack the SDK
      run: dotnet pack -c Release src/Ffx.Atel.Sdk -o artifacts/sdk-feed

    - name: Pack the templates
      run: dotnet pack -c Release src/Ffx.Atel.Templates -o artifacts/sdk-feed

    - name: Pack the atel tool
      run: dotnet pack -c Release src/Ffx.Atel.Cli -o artifacts/sdk-feed

    # As a modder installs it from nuget.org, from the feed only, into a tool path of its own.
    - name: Install and run the atel tool
      shell: bash
      run: |
        nupkg=$(ls artifacts/sdk-feed/AtelSharp.Cli.*.nupkg)
        version=$(basename "$nupkg" .nupkg); version=${version#AtelSharp.Cli.}
        dotnet tool install AtelSharp.Cli --version "$version" --tool-path artifacts/atel-tool --add-source artifacts/sdk-feed
        artifacts/atel-tool/atel --help

    - name: No checkout path in the packages
      shell: bash
      run: |
        for pkg in artifacts/sdk-feed/*.nupkg; do
          if unzip -p "$pkg" | grep -aqF "$GITHUB_WORKSPACE"; then
            echo "$pkg names the checkout's path"; exit 1
          fi
        done

  editors:
    # VS Code extension and Rider plugin (editors.yml, shared with the release).
    uses: ./.github/workflows/editors.yml
