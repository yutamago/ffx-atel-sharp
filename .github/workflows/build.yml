# SPDX-License-Identifier: MIT
name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    # The tools must run on every OS a modder may use. The corpus tests need
    # the game (FFX_GAME_DIR), which CI doesn't have, so they skip here.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Build
      run: dotnet build -c Release ffx-atel-sharp.slnx

    - name: Test
      run: dotnet test -c Release --no-build ffx-atel-sharp.slnx

    # The SDK package (docs/sdk.md), packed on every OS a modder may build on. It is not published
    # anywhere: the repo is private, and where it goes is still to be decided.
    - name: Pack the SDK
      run: dotnet pack -c Release src/Ffx.Atel.Sdk -o artifacts/sdk-feed

    - name: No checkout path in the SDK package
      shell: bash
      run: |
        pkg=$(ls artifacts/sdk-feed/Ffx.Atel.Sdk.*.nupkg)
        if unzip -p "$pkg" | grep -aqF "$GITHUB_WORKSPACE"; then
          echo "the SDK package names the checkout's path"; exit 1
        fi
