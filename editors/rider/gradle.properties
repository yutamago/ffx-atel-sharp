# SPDX-License-Identifier: MIT
# Any property can be overridden on the command line: -P<name>=<value>.

PluginVersion=0.1.0
BuildConfiguration=Release

# The Rider SDK (https://www.jetbrains.com/intellij-repository/snapshots): keep in step with SdkVersion in
# src/dotnet/Plugin.props (2026.3-EAP8-SNAPSHOT here, 2026.3.0-eap08 there). Releases: 2026.3, EAPs: 2026.3-EAP8-SNAPSHOT.
ProductVersion=2026.3-EAP8-SNAPSHOT

# Rider from Maven (the template's setting), not the installer.
org.jetbrains.intellij.platform.buildFeature.useBinaryReleases=false

# The IDE brings its own Kotlin standard library.
kotlin.stdlib.default.dependency=false

# Memory: the machine running this is shared. One small daemon, Kotlin compiled in it.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=false
